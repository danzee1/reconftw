<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>reconFTW Elite Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .neon-border { border: 1px solid rgba(56, 189, 248, 0.5); box-shadow: 0 0 15px rgba(56, 189, 248, 0.2); }
        .stat-card:hover { transform: translateY(-5px); transition: all 0.3s ease; }
    </style>
</head>
<body class="p-8">
    <div class="max-w-7xl mx-auto">
        <header class="flex justify-between items-center mb-12">
            <div>
                <h1 class="text-4xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-sky-400 to-indigo-500">reconFTW <span class="text-white font-light">Elite</span></h1>
                <p class="text-slate-400 mt-2" id="target-domain">Target: Loading...</p>
            </div>
            <div class="text-right">
                <div class="glass px-4 py-2 rounded-lg text-sm">
                    <span class="text-slate-400">Last Updated:</span> <span id="scan-date">Loading...</span>
                </div>
            </div>
        </header>

        <!-- Stats Grid -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-12">
            <div class="glass p-6 rounded-2xl stat-card neon-border">
                <div class="flex items-center space-x-4">
                    <div class="p-3 bg-sky-500/20 rounded-lg text-sky-400"><i class="fas fa-sitemap fa-lg"></i></div>
                    <div>
                        <p class="text-slate-400 text-sm">Subdomains</p>
                        <h3 class="text-2xl font-bold" id="stat-subdomains">0</h3>
                    </div>
                </div>
            </div>
            <div class="glass p-6 rounded-2xl stat-card">
                <div class="flex items-center space-x-4">
                    <div class="p-3 bg-indigo-500/20 rounded-lg text-indigo-400"><i class="fas fa-globe fa-lg"></i></div>
                    <div>
                        <p class="text-slate-400 text-sm">Web Servers</p>
                        <h3 class="text-2xl font-bold" id="stat-webs">0</h3>
                    </div>
                </div>
            </div>
            <div class="glass p-6 rounded-2xl stat-card">
                <div class="flex items-center space-x-4">
                    <div class="p-3 bg-rose-500/20 rounded-lg text-rose-400"><i class="fas fa-bug fa-lg"></i></div>
                    <div>
                        <p class="text-slate-400 text-sm">Vulnerabilities</p>
                        <h3 class="text-2xl font-bold" id="stat-vulns">0</h3>
                    </div>
                </div>
            </div>
            <div class="glass p-6 rounded-2xl stat-card">
                <div class="flex items-center space-x-4">
                    <div class="p-3 bg-amber-500/20 rounded-lg text-amber-400"><i class="fas fa-key fa-lg"></i></div>
                    <div>
                        <p class="text-slate-400 text-sm">Secrets Found</p>
                        <h3 class="text-2xl font-bold" id="stat-secrets">0</h3>
                    </div>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Main Content Area -->
            <div class="lg:col-span-2 space-y-8">
                <div class="glass p-8 rounded-2xl">
                    <h2 class="text-xl font-semibold mb-6 flex items-center">
                        <i class="fas fa-chart-bar mr-3 text-sky-400"></i> Vulnerability Severity Distribution
                    </h2>
                    <canvas id="vulnChart" height="150"></canvas>
                </div>

                <div class="glass p-8 rounded-2xl">
                    <h2 class="text-xl font-semibold mb-6 flex items-center">
                        <i class="fas fa-list mr-3 text-indigo-400"></i> Recent Discoveries
                    </h2>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left">
                            <thead class="border-b border-slate-700">
                                <tr>
                                    <th class="py-4 text-slate-400 font-medium">Type</th>
                                    <th class="py-4 text-slate-400 font-medium">Finding</th>
                                    <th class="py-4 text-slate-400 font-medium">Severity</th>
                                </tr>
                            </thead>
                            <tbody id="findings-table">
                                <!-- Data populated by JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Sidebar -->
            <div class="space-y-8">
                <div class="glass p-8 rounded-2xl border-l-4 border-sky-500">
                    <h2 class="text-xl font-semibold mb-6 flex items-center">
                        <i class="fas fa-project-diagram mr-3 text-sky-400"></i> Assets
                    </h2>
                    <ul class="space-y-4" id="asset-list">
                        <!-- Assets populated by JS -->
                    </ul>
                </div>

                <div class="glass p-8 rounded-2xl border-l-4 border-amber-500">
                    <h2 class="text-xl font-semibold mb-6 flex items-center">
                        <i class="fas fa-shield-alt mr-3 text-amber-400"></i> Security Leaks
                    </h2>
                    <div id="leaks-container" class="space-y-4 text-sm">
                        <!-- Leaks populated by JS -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Data will be injected here by the reporting script
        const scanData = {"domain":"Loading..."}; // DATA_INJECTION_POINT

        // Populate Dashboard
        document.getElementById('target-domain').innerText = `Target: ${scanData.domain}`;
        document.getElementById('scan-date').innerText = scanData.date;
        document.getElementById('stat-subdomains').innerText = scanData.stats.subdomains;
        document.getElementById('stat-webs').innerText = scanData.stats.webs;
        document.getElementById('stat-vulns').innerText = scanData.stats.vulns;
        document.getElementById('stat-secrets').innerText = scanData.stats.secrets;

        // Chart
        const ctx = document.getElementById('vulnChart').getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['Critical', 'High', 'Medium', 'Low', 'Info'],
                datasets: [{
                    label: 'Vulnerabilities',
                    data: [scanData.vulns.critical, scanData.vulns.high, scanData.vulns.medium, scanData.vulns.low, scanData.vulns.info],
                    backgroundColor: ['#f43f5e', '#fb923c', '#facc15', '#38bdf8', '#94a3b8'],
                    borderRadius: 8
                }]
            },
            options: {
                responsive: true,
                plugins: { legend: { display: false } },
                scales: {
                    y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#94a3b8' } },
                    x: { grid: { display: false }, ticks: { color: '#94a3b8' } }
                }
            }
        });

        // Findings Table
        const findingsTable = document.getElementById('findings-table');
        scanData.recentFindings.forEach(f => {
            const row = `
                <tr class="border-b border-slate-800/50 hover:bg-slate-800/30 transition-colors">
                    <td class="py-4 text-sm font-medium text-sky-400">${f.type}</td>
                    <td class="py-4 text-sm text-slate-300 truncate max-w-xs">${f.finding}</td>
                    <td class="py-4">
                        <span class="px-2 py-1 rounded text-[10px] font-bold uppercase ${
                            f.severity === 'critical' ? 'bg-rose-500/20 text-rose-500' :
                            f.severity === 'high' ? 'bg-orange-500/20 text-orange-500' :
                            f.severity === 'medium' ? 'bg-amber-500/20 text-amber-500' :
                            'bg-slate-500/20 text-slate-400'
                        }">${f.severity}</span>
                    </td>
                </tr>
            `;
            findingsTable.innerHTML += row;
        });

        // Asset List
        const assetList = document.getElementById('asset-list');
        scanData.assets.forEach(a => {
            assetList.innerHTML += `<li class="text-sm text-slate-400 flex items-center"><i class="fas fa-chevron-right mr-2 text-sky-500/50 text-[10px]"></i> ${a}</li>`;
        });

        // Leaks
        const leaksContainer = document.getElementById('leaks-container');
        scanData.leaks.forEach(l => {
            leaksContainer.innerHTML += `
                <div class="p-3 rounded bg-amber-500/5 border border-amber-500/10 text-slate-300">
                    <p class="font-semibold text-amber-400 mb-1">${l.type}</p>
                    <p class="truncate opacity-80">${l.content}</p>
                </div>
            `;
        });
    </script>
</body>
</html>
